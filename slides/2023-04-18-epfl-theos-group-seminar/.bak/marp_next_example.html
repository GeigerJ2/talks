<h1>Marp</h1>
<p><img src="https://avatars1.githubusercontent.com/u/20685754?v=4" alt="" style="height:250px;" /></p>
<h5>Markdown presentation ecosystem</h5>
<h6>by Marp Team (<a href="https://github.com/marp-team">@marp-team</a>)</h6>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2">
<h1>Features</h1>
<ul>
<li><img class="emoji" draggable="false" alt="📝" src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f4dd.svg" data-marp-twemoji=""/> <strong>Write slide deck with plain Markdown</strong> (CommonMark)</li>
<li><img class="emoji" draggable="false" alt="🏭" src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f3ed.svg" data-marp-twemoji=""/> Built on <a href="https://github.com/marp-team/marpit">Marpit framework</a>: A brand-new skinny framework for creating slide deck</li>
<li><img class="emoji" draggable="false" alt="⚙️" src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/2699.svg" data-marp-twemoji=""/> <a href="https://github.com/marp-team/marp-core">Marp Core</a>: Easy to start using the core engine and built-in themes via npm</li>
<li><img class="emoji" draggable="false" alt="📺" src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f4fa.svg" data-marp-twemoji=""/> <a href="https://github.com/marp-team/marp-cli">Marp CLI</a>: Convert Markdown into HTML, PDF, PPTX, and images</li>
<li><img class="emoji" draggable="false" alt="🆚" src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f19a.svg" data-marp-twemoji=""/> <a href="https://github.com/marp-team/marp-vscode">Marp for VS Code</a>: Live-preview your deck while editting</li>
<li>and more...</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3">
<h1>How to write slides?</h1>
<p>Split pages by horizontal ruler (e.g. <code>---</code>). It's very simple.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-markdown"><span class="hljs-section"># Slide 1</span>

foobar

---

<span class="hljs-section"># Slide 2</span>

foobar
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4">
<h1>Directives</h1>
<p>Marp has extended syntax called <strong>&quot;Directives&quot;</strong> to support creating beautiful slides.</p>
<p>Insert front-matter to the top of Markdown:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>---
theme: default
---
</code></pre>
<p>or HTML comment to anywhere:</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-comment">&lt;!-- theme: default --&gt;</span>
</code></pre>
<p><a href="https://marpit.marp.app/directives">https://marpit.marp.app/directives</a></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5">
<h2><a href="https://marpit.marp.app/directives?id=global-directives">Global directives</a></h2>
<ul>
<li><code>theme</code>: Choose theme</li>
<li><code>size</code>: Choose slide size from <code>16:9</code> and <code>4:3</code> <em>(except Marpit framework)</em></li>
<li><a href="https://marpit.marp.app/directives?id=heading-divider"><code>headingDivider</code></a>: Instruct to divide slide pages at before of specified heading levels</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code>---
theme: gaia
size: 4:3
---

# Content
</code></pre>
<blockquote>
<p>Marp can use <a href="https://github.com/marp-team/marp-core/tree/master/themes#readme">built-in themes in Marp Core</a>: <code>default</code>, <code>gaia</code>, and <code>uncover</code>.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6">
<h2><a href="https://marpit.marp.app/directives?id=local-directives">Local directives</a></h2>
<p>These are the setting value per slide pages.</p>
<ul>
<li><code>paginate</code>: Show pagination by set <code>true</code></li>
<li><code>header</code>: Specify the contents for header</li>
<li><code>footer</code>: Specify the contents for footer</li>
<li><code>class</code>: Set HTML class for current slide</li>
<li><code>color</code>: Set text color</li>
<li><code>backgroundColor</code>: Set background color</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-marpit-advanced-background="background" data-marpit-advanced-background-split="right" style="--marpit-advanced-background-split:50%;"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;https://marpit.marp.app/assets/directives.png&quot;);background-size:95%;"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="7" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right" style="--marpit-advanced-background-split:50%;">
<h3>Spot directives</h3>
<p>Local directives would apply to <strong>defined page and following pages</strong>.</p>
<p>They can apply to single page by using underscore prefix such as <code>_class</code>.</p>
</section>
</foreignObject><foreignObject width="1280" height="720" data-marpit-advanced-background="pseudo"><section data-marpit-advanced-background="pseudo" data-marpit-advanced-background-split="right" style=""></section></foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-class="invert" class="invert" style="--class:invert;">
<h3>Example</h3>
<p>This page is using invert color scheme <a href="https://github.com/marp-team/marp-core/tree/master/themes#readme">defined in Marp built-in theme</a>.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-comment">&lt;!-- _class: invert --&gt;</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9">
<h1><a href="https://marpit.marp.app/image-syntax">Image syntax</a></h1>
<p>You can resize image size and apply filters through keywords: <code>width</code> (<code>w</code>), <code>height</code> (<code>h</code>), and filter CSS keywords.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-markdown">![<span class="hljs-string">width:100px height:100px</span>](<span class="hljs-link">image.png</span>)
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-markdown">![<span class="hljs-string">blur sepia:50%</span>](<span class="hljs-link">filters.png</span>)
</code></pre>
<p>Please refer <a href="https://marpit.marp.app/image-syntax?id=resizing-image">resizing image syntax</a> and <a href="https://marpit.marp.app/image-syntax?id=image-filters">a list of CSS filters</a>.</p>
<p><img src="https://avatars1.githubusercontent.com/u/20685754?v=4" alt="" style="width:100px;height:100px;" /> <img src="https://avatars1.githubusercontent.com/u/20685754?v=4" alt="" style="width:100px;height:100px;filter:blur(10px) sepia(50%);" /></p>
</section>

<h2><a href="https://marpit.marp.app/fragmented-list">Fragmented list</a></h2>
<p>Marp will parse a list with asterisk marker as the fragmented list for appearing contents one by one. (<em><strong>Only for exported HTML</strong> by <a href="https://github.com/marp-team/marp-cli">Marp CLI</a> / <a href="https://github.com/marp-team/marp-vscode">Marp for VS Code</a></em>)</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-markdown"><span class="hljs-section"># Bullet list</span>

<span class="hljs-bullet">-</span> One
<span class="hljs-bullet">-</span> Two
<span class="hljs-bullet">-</span> Three

---

<span class="hljs-section"># Fragmented list</span>

<span class="hljs-bullet">*</span> One
<span class="hljs-bullet">*</span> Two
<span class="hljs-bullet">*</span> Three
</code></pre>

<h2>Auto-scaling (only for <a href="https://github.com/marp-team/marp-core">Marp Core</a>)</h2>
<p><em>Several built-in themes</em> are supported auto-scaling for code blocks and math typesettings.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Too long code block will be scaled-down automatically. ------------&gt;
</code></pre>

</code></pre>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16">
<h5 is="marp-h5" data-auto-scaling> Auto-fitting header (only for <a href="https://github.com/marp-team/marp-core">Marp Core</a>)</h5>
<h5 is="marp-h5" data-auto-scaling> is available by annotating <code>&lt;!--fit--&gt;</code> in headings.</h5>
<br />
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html">## <span class="hljs-comment">&lt;!--fit--&gt;</span> Auto-fitting header (only for Marp Core)
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17">
<h2><a href="https://marpit.marp.app/theme-css">Theme CSS</a></h2>
<p>Marp uses <code>&lt;section&gt;</code> as the container of each slide. And others are same as styling for plain Markdown. The customized theme can use in <a href="https://github.com/marp-team/marp-cli">Marp CLI</a> and <a href="https://github.com/marp-team/marp-vscode">Marp for VS Code</a>.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-css"><span class="hljs-comment">/* @theme your-theme */</span>

<span class="hljs-keyword">@import</span> <span class="hljs-string">&#x27;default&#x27;</span>;

<span class="hljs-selector-tag">section</span> {
  <span class="hljs-comment">/* Specify slide size */</span>
  <span class="hljs-attribute">width</span>: <span class="hljs-number">960px</span>;
  <span class="hljs-attribute">height</span>: <span class="hljs-number">720px</span>;
}

<span class="hljs-selector-tag">h1</span> {
  <span class="hljs-attribute">font-size</span>: <span class="hljs-number">30px</span>;
  <span class="hljs-attribute">color</span>: <span class="hljs-number">#c33</span>;
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18">
<h2><a href="https://marpit.marp.app/theme-css?id=tweak-style-through-markdown">Tweak style in Markdown</a></h2>
<p><code>&lt;style&gt;</code> tag in Markdown will work in the context of theme CSS.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-markdown">---
<span class="hljs-section">theme: default
---</span>

<span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">style</span>&gt;</span></span>
section {
  background: yellow;
}
<span class="language-xml"><span class="hljs-tag">&lt;/<span class="hljs-name">style</span>&gt;</span></span>

Re-painted yellow background, ha-ha.
</code></pre>
<blockquote>
<p>You can also add custom styling by class like <code>section.custom-class { ... }</code>.<br />
Apply style through <code>&lt;!-- _class: custom-class --&gt;</code>.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-marpit-scope-5R4s9tay="">
<h2><a href="https://marpit.marp.app/theme-css?id=scoped-style">Scoped style</a></h2>
<p>If you want one-shot styling for current page, you can use <code>&lt;style scoped&gt;</code>.</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-markdown"><span class="language-xml"><span class="hljs-tag">&lt;<span class="hljs-name">style</span> <span class="hljs-attr">scoped</span>&gt;</span></span>
a {
  color: green;
}
<span class="language-xml"><span class="hljs-tag">&lt;/<span class="hljs-name">style</span>&gt;</span></span>

![<span class="hljs-string">Green link!</span>](<span class="hljs-link">https://marp.app/</span>)
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20">
